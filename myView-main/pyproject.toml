[project]
name = "mdview"
version = "0.1.0"
description = "Standalone Windows desktop markdown viewer with live-reload and copy-reference."
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.0",
    "watchdog>=4.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "Pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mdview"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that exercise multiple components together",
]
